# Credenciais do banco NAO ficam no codigo: vem de variaveis de ambiente
# (veja .env.example na raiz do repositorio).
# Em desenvolvimento, o arquivo opcional ../.env tambem e lido (formato chave=valor).
# Variaveis de ambiente de verdade tem prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
