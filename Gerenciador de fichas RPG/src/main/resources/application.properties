# Credenciais do banco NAO ficam no codigo: vem de variaveis de ambiente
# (veja .env.example na raiz do repositorio).
# Em desenvolvimento, o arquivo opcional ../.env tambem e lido (formato chave=valor).
# Variaveis de ambiente de verdade tem prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# SQL gerado pelo Hibernate vai pelo logger (nivel debug), e nao pela saida padrao.
logging.level.org.hibernate.SQL=debug

# O mapeamento para DTO acontece dentro do servico (transacao); nao precisa manter a sessao aberta na view.
spring.jpa.open-in-view=false

# O Spring registra em WARN a exceção de validação com o valor rejeitado (dado pessoal); o handler já loga só os nomes dos campos.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=error

# JSON de entrada estrito: chave desconhecida (ex.: "STR") da 400 em vez de ser ignorada (ADR 0007).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Nomes de tabela/coluna: estrategia padrao do Boot (snake_case minusculo).
# Nao use globally_quoted_identifiers: com aspas o Hibernate 7 nao converte os nomes.
