# Credenciais do banco NAO ficam no codigo: vem de variaveis de ambiente
# (veja .env.example na raiz do repositorio).
# Em desenvolvimento, o arquivo opcional ../.env tambem e lido (formato chave=valor).
# Variaveis de ambiente de verdade tem prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Compatibilidade com o upgrade para o Spring Boot 4 (nao mude sem migrar os dados):
# o Boot 2/3 convertia nomes Java em snake_case minusculo (SheetPlayer -> sheet_player).
# O Boot 4 deixou de aplicar isso por padrao; sem esta linha o Hibernate criaria outra
# tabela ("SheetPlayer") e nao enxergaria os dados de quem ja usa a aplicacao.
# (ver NomesLegadosNamingStrategy)
spring.jpa.hibernate.naming.physical-strategy=Atos.SpringAPI.Config.NomesLegadosNamingStrategy
