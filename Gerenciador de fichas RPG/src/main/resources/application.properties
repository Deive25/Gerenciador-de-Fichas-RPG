# Credenciais do banco NAO ficam no codigo: vem de variaveis de ambiente
# (veja .env.example na raiz do repositorio).
# Em desenvolvimento, o arquivo opcional ../.env tambem e lido (formato chave=valor).
# Variaveis de ambiente de verdade tem prioridade sobre o arquivo.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O esquema e criado so pelas migracoes Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se a entidade bate com o banco; se divergir, a aplicacao nao sobe (ADR 0009).
spring.jpa.hibernate.ddl-auto=validate
# SQL gerado pelo Hibernate vai pelo logger (nivel debug), e nao pela saida padrao.
logging.level.org.hibernate.SQL=debug

# O mapeamento para DTO acontece dentro do servico (transacao); nao precisa manter a sessao aberta na view.
spring.jpa.open-in-view=false

# O Spring registra em WARN a exceção de validação com o valor rejeitado (dado pessoal); o handler já loga só os nomes dos campos.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=error

# JSON de entrada estrito: chave desconhecida (ex.: "STR") da 400 em vez de ser ignorada (ADR 0007).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Nomes de tabela/coluna: estrategia padrao do Boot (snake_case minusculo).
# Nao use globally_quoted_identifiers: com aspas o Hibernate 7 nao converte os nomes.

# Login (2.2). A chave do JWT de acesso (HS256) vem do .env (JWT_SEGREDO) e a API nao sobe sem ela, com ao menos 32 bytes.
# Gere uma com: openssl rand -base64 48
app.jwt.segredo=${JWT_SEGREDO:}

# Origens permitidas no CORS, separadas por virgula. O 2.6 (deploy) so troca esta propriedade.
app.cors.origens=http://localhost:4200

# Login com Google (2.5). O Client ID e PUBLICO (o navegador o mostra a qualquer um) e nao e segredo; o client secret nao e usado.
# A API confere o ID token (RS256) com as chaves publicas do Google, o aud (este client ID) e o iss.
app.google.client-id=${GOOGLE_CLIENT_ID:181222736917-1k8vp73jptcmrbgceam718qoa55p0i39.apps.googleusercontent.com}
app.google.jwks-url=https://www.googleapis.com/oauth2/v3/certs

# Deploy gratuito (2.6, Render + Neon). O que a producao define por variavel de ambiente (nada disto vai para o repositorio):
#   DB_URL            endpoint DIRETO do Neon (nao o pooler: o Flyway precisa de sessao), com ?sslmode=require
#   DB_USERNAME, DB_PASSWORD
#   JWT_SEGREDO       chave nova, so da producao (openssl rand -base64 48)
#   APP_CORS_ORIGENS  https://<projeto>.pages.dev  (varias origens: separadas por virgula)
#   SPRING_PROFILES_ACTIVE=demo   liga o POST /auth/demo (a conta de demonstracao)
#   LOGGING_LEVEL_ORG_HIBERNATE_SQL=info   para nao registrar todo SQL
#   JAVA_TOOL_OPTIONS ajustes da JVM para 512 MB e 0,1 CPU (o Dockerfile traz um padrao)

# Poucas conexoes: o plano gratuito do Neon e da API sao pequenos (o padrao do Hikari e 10).
spring.datasource.hikari.maximum-pool-size=5

# Atras do proxy do Render: o Tomcat troca o IP pelo do X-Forwarded-For, mas SO quando o pedido vem de um proxy interno
# (faixas privadas). Um X-Forwarded-For enviado direto por um cliente de fora e ignorado, e o limite de tentativas nao e burlado.
server.forward-headers-strategy=native

# Saude: so o health e exposto, com as probes. A de vida (/actuator/health/liveness) nao consulta o banco, para o Render
# e o front perguntarem sem acordar o Neon; o health completo (que consulta o banco) exige login.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Limite de tentativas nas rotas de entrada (2.6): janela fixa por IP e por rota, em memoria (uma instancia so).
# /auth/login, /auth/registro e /auth/google: 10 por minuto. /auth/demo: 5 a cada 10 minutos. Acima disso, 429 com Retry-After.
# (Os testes sobem o maximo para os logins de varios testes nao estourarem o limite.)
app.limite.auth.max=10
app.limite.auth.janela=PT1M
app.limite.demo.max=5
app.limite.demo.janela=PT10M
