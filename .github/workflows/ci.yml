name: CI

# Roda em push na main e em todo pull request. Push em outras branches so dispara o CI
# quando houver PR aberto; assim um commit enviado para uma branch com PR nao roda duas vezes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Gerenciador de fichas RPG"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os testes sobem um PostgreSQL em container (Testcontainers); o ubuntu-latest ja tem Docker.
      - name: Build e testes
        run: ./mvnw -B verify

  # Roda em paralelo com o backend: compila o Angular e roda os testes unitarios (Vitest).
  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Angular 22 pede Node ^22.22.3 ou ^24.15.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Testes unitarios
        run: npx ng test --watch=false

  # Teste de ponta a ponta (Playwright): depois dos outros dois, sobe PostgreSQL, API e front de verdade
  # e percorre o fluxo da mesa ao vivo com dois navegadores (mestre e jogadora).
  e2e:
    name: Ponta a ponta (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        # Valores de teste, validos so dentro deste job (o servico nao e exposto fora do runner).
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-senha-de-teste
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Nomes lidos pelo application.properties. O Playwright repassa o ambiente ao java -jar.
      DB_URL: jdbc:postgresql://localhost:5432/e2e
      DB_USERNAME: e2e
      DB_PASSWORD: e2e-senha-de-teste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Angular 22 pede Node ^22.22.3 ou ^24.15.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A chave e gerada a cada execucao e nunca fica escrita no repositorio.
      - name: Gerar o JWT_SEGREDO
        run: |
          segredo=$(openssl rand -base64 48)
          echo "::add-mask::$segredo"
          echo "JWT_SEGREDO=$segredo" >> "$GITHUB_ENV"

      # O jar e o que o webServer do Playwright executa; os testes ja rodaram no job backend.
      - name: Empacotar a API
        working-directory: "Gerenciador de fichas RPG"
        run: ./mvnw -B -DskipTests package

      - name: Instalar dependencias do front
        working-directory: frontend
        run: npm ci

      - name: Instalar o Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Teste de ponta a ponta
        working-directory: frontend
        run: npx playwright test

      - name: Guardar relatorio e rastreamento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
