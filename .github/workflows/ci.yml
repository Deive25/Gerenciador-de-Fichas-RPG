name: CI

# Roda em push na main e em todo pull request. Push em outras branches so dispara o CI
# quando houver PR aberto; assim um commit enviado para uma branch com PR nao roda duas vezes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Gerenciador de fichas RPG"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os testes sobem um PostgreSQL em container (Testcontainers); o ubuntu-latest ja tem Docker.
      - name: Build e testes
        run: ./mvnw -B verify

  # Roda em paralelo com o backend: compila o Angular e roda os testes unitarios (Vitest).
  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Angular 22 pede Node ^22.22.3 ou ^24.15.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Testes unitarios
        run: npx ng test --watch=false
