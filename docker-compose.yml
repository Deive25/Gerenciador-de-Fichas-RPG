# Banco PostgreSQL para desenvolvimento local.
# As credenciais vem do arquivo .env (copie de .env.example).
# A imagem e a mesma usada nos testes (IntegrationTestBase): mantenha as duas na mesma versao.
services:
  postgres:
    image: postgres:17
    container_name: fichas-rpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # só acessível nesta máquina
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
