<div class="aneis">
  @for (anel of aneis(); track anel.codigo) {
    <app-anel-status
      [rotulo]="anel.rotulo"
      [tipo]="anel.tipo"
      [atual]="valores()[anel.codigo]"
      [maximo]="maximo(anel.codigo)"
      editavel
      (ajustar)="ajustar(anel.codigo, $event)"
      (definir)="definir(anel.codigo, $event)"
    />
  }
</div>
@if (salvando()) {
  <p class="estado" role="status">salvando…</p>
}
@if (erro(); as e) {
  <p class="erro" role="alert">{{ e.titulo }}: {{ e.detalhe }}</p>
}
