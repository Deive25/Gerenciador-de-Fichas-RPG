<h2 class="titulo">Fichas</h2>

@switch (estado()) {
  @case ('carregando') {
    <p class="aviso" role="status">Carregando fichas…</p>
  }
  @case ('erro') {
    <div class="aviso-erro" role="alert">
      <strong>{{ erro()?.titulo }}</strong>
      <p>{{ erro()?.detalhe }}</p>
      <button type="button" class="botao" (click)="carregar()">Tentar de novo</button>
    </div>
  }
  @default {
    @for (ficha of fichas(); track ficha.id) {
      <a class="card-ficha" [routerLink]="['/fichas', ficha.id]" routerLinkActive="selecionada">
        <span class="personagem">{{ ficha.personagem }}</span>
        <span class="jogador">{{ ficha.jogador }}</span>
        <app-barra-status rotulo="Vida" tipo="vida" [atual]="ficha.vidaAtual" [maximo]="ficha.vidaMaxima" />
        <app-barra-status
          rotulo="Sanidade"
          tipo="sanidade"
          [atual]="ficha.sanidadeAtual"
          [maximo]="ficha.sanidadeMaxima"
        />
      </a>
    } @empty {
      <div class="vazio">
        <p>Nenhuma ficha ainda.</p>
        <a class="botao" routerLink="/fichas/nova">Criar a primeira ficha</a>
      </div>
    }
  }
}
