<div class="resultado" role="status" aria-live="polite">
  <strong>{{ titulo() }}</strong>
  <span class="dados" aria-hidden="true">
    @for (dado of resultado().dados; track $index) {
      <span class="dado" [class.mantido]="$index === indiceMantido()">{{ dado }}</span>
    }
  </span>
  @if (avisoNatural(); as aviso) {
    <span class="natural">{{ aviso }}</span>
  }
  <span class="so-leitor">{{ leitura() }}</span>
</div>
